[package]
name = "freedom-near-l3-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
near-workspaces = { version = "=0.23.0", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
