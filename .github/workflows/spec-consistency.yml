name: Specification and simulator gates

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "spec/**"
      - "docs/**"
      - "sim/**"
      - "tools/**"
      - ".github/CODEOWNERS"
      - ".github/workflows/spec-consistency.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "spec/**"
      - "docs/**"
      - "sim/**"
      - "tools/**"
      - ".github/CODEOWNERS"
      - ".github/workflows/spec-consistency.yml"

permissions:
  contents: read

jobs:
  protocol-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check canonical specification consistency
        run: python tools/check_spec_consistency.py

      - name: Check Freedom-DCBOR-1 vectors
        run: python tools/check_vectors.py

      - name: Run deterministic L1 simulator
        run: python sim/simctl.py --all --quiet --evidence-dir build/sim-evidence
