name: Specification, core and simulator gates

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "spec/**"
      - "docs/**"
      - "core/**"
      - "sim/**"
      - "near/**"
      - "tools/**"
      - "app/build.gradle.kts"
      - ".github/CODEOWNERS"
      - ".github/workflows/spec-consistency.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "spec/**"
      - "docs/**"
      - "core/**"
      - "sim/**"
      - "near/**"
      - "tools/**"
      - "app/build.gradle.kts"
      - ".github/CODEOWNERS"
      - ".github/workflows/spec-consistency.yml"

concurrency:
  group: freedom-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Check canonical specification consistency
        run: python tools/check_spec_consistency.py

      - name: Check development-stack consistency
        run: python tools/check_dev_stack.py

      - name: Check Freedom-DCBOR-1 vectors
        run: python tools/check_vectors.py

      - name: Compile and test shared Freedom core
        run: python tools/run_core_tests.py

      - name: Run deterministic L1 simulator against shared core
        run: python sim/simctl.py --all --quiet --no-build --evidence-dir build/sim-evidence

      - name: Validate L3 canonical differential oracle vectors
        run: python sim/l3/differential.py --oracle-only

  l2-docker-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real-container path failure/address-rebind smoke
        run: python sim/l2/run_docker.py

  l3-near-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install pinned NEAR Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          rustup target add wasm32-unknown-unknown --toolchain 1.93.0
          cargo install --locked --no-default-features cargo-near --version 0.22.0
          rustc --version
          cargo --version
          cargo near --version
      - name: Run real NEAR Sandbox differential
        env:
          NEAR_ENABLE_SANDBOX_LOG: "0"
        run: >-
          python sim/l3/differential.py
          --adapter-cmd "cargo run --quiet --manifest-path near/l3-adapter/Cargo.toml"
