name: NEAR contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.93 and WebAssembly target
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-near 0.22.0
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh \
            | sh

      - name: Test contract
        run: cargo test --locked --package freedom-registry

      - name: Build contract WASM
        working-directory: contract
        run: cargo near build non-reproducible-wasm --no-abi

      - name: Upload contract WASM
        uses: actions/upload-artifact@v7
        with:
          name: freedom-registry-wasm
          path: target/near/freedom_registry/freedom_registry.wasm
          if-no-files-found: error
          retention-days: 14
