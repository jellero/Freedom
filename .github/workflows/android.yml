name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
