<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Share Freedom product screens</title>
  <desc id="desc">Concept screens for decentralized Freedom app distribution showing Install QR, exact artifact verification, threshold release state, Android signer lineage, bootstrap freshness floor and fail-closed installation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b11"/><stop offset="1" stop-color="#0a1720"/></linearGradient><style>.bg{fill:url(#bg)}.panel{fill:#0b1620;stroke:#223342;stroke-width:2}.phone{fill:#02070b;stroke:#64748b;stroke-width:4}.screen{fill:#08131c}.top{fill:#0d1a25}.card{fill:#101f2b;stroke:#1e3444;stroke-width:1.5}.sel{fill:#10291d;stroke:#7ee35d;stroke-width:2}.warn{fill:#2b2110;stroke:#f59e0b;stroke-width:1.5}.green{fill:#7ee35d}.cyan{fill:#4cc9f0}.purple{fill:#a78bfa}.orange{fill:#f59e0b}.title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.h1{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.h2{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.txt{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7e2ea}.tiny{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.badge{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#b8c7d4}</style></defs>
  <rect class="bg" width="1600" height="920"/><text class="title" x="70" y="72">Share Freedom</text><text class="subtitle" x="70" y="106">Untrusted byte sources · threshold release trust · verified policy state · bootstrap freshness</text><rect class="panel" x="70" y="140" width="1460" height="700" rx="30"/>

  <rect class="phone" x="125" y="185" width="390" height="610" rx="46"/><rect class="screen" x="144" y="210" width="352" height="560" rx="30"/><text class="h1" x="168" y="252">←  Share Freedom</text><text class="tiny" x="168" y="280">Current verified release</text>
  <rect class="sel" x="166" y="310" width="308" height="108" rx="18"/><text class="h2" x="186" y="340">Freedom Communication 1.4.2</text><text class="tiny" x="186" y="367">Release</text><text class="badge" x="450" y="367" text-anchor="end" fill="#7ee35d">VERIFIED</text><text class="tiny" x="186" y="393">Security state</text><text class="badge" x="450" y="393" text-anchor="end" fill="#7ee35d">CURRENT</text>
  <rect x="226" y="448" width="188" height="188" rx="12" fill="#f8fafc"/>
  <g fill="#071019"><rect x="242" y="464" width="48" height="48"/><rect x="250" y="472" width="32" height="32" fill="#f8fafc"/><rect x="258" y="480" width="16" height="16"/><rect x="350" y="464" width="48" height="48"/><rect x="358" y="472" width="32" height="32" fill="#f8fafc"/><rect x="366" y="480" width="16" height="16"/><rect x="242" y="572" width="48" height="48"/><rect x="250" y="580" width="32" height="32" fill="#f8fafc"/><rect x="258" y="588" width="16" height="16"/><rect x="308" y="476" width="12" height="12"/><rect x="326" y="494" width="12" height="12"/><rect x="306" y="516" width="18" height="12"/><rect x="332" y="522" width="12" height="22"/><rect x="356" y="532" width="18" height="12"/><rect x="382" y="548" width="12" height="18"/><rect x="306" y="558" width="14" height="14"/><rect x="330" y="578" width="20" height="12"/><rect x="356" y="590" width="12" height="28"/><rect x="378" y="584" width="18" height="12"/></g>
  <text class="tiny" x="320" y="662" text-anchor="middle">Install QR · capability expires in 10 min</text><rect class="card" x="166" y="684" width="308" height="52" rx="18"/><text class="mono" x="186" y="716">freedom-r42-454fjk…apk</text><text class="badge" x="450" y="716" text-anchor="end" fill="#f59e0b">LOCATOR ONLY</text><text class="tiny" x="320" y="758" text-anchor="middle">The sharing client does not possess release-signing private keys</text>

  <rect class="phone" x="605" y="185" width="390" height="610" rx="46"/><rect class="screen" x="624" y="210" width="352" height="560" rx="30"/><text class="h1" x="650" y="252">←  Verify release</text><text class="tiny" x="650" y="282">Fail closed before invoking Android installer</text>
  <circle cx="800" cy="350" r="56" fill="#10291d" stroke="#7ee35d" stroke-width="4"/><text class="title" x="800" y="365" text-anchor="middle">✓</text><text class="badge" x="800" y="425" text-anchor="middle" fill="#7ee35d">VERIFICATION COMPLETE</text>
  <g><rect class="card" x="646" y="448" width="308" height="40" rx="12"/><text class="txt" x="666" y="474">SHA-256 exact match</text><text class="badge" x="930" y="474" text-anchor="end" fill="#7ee35d">OK</text><rect class="card" x="646" y="496" width="308" height="40" rx="12"/><text class="txt" x="666" y="522">Threshold release signatures</text><text class="badge" x="930" y="522" text-anchor="end" fill="#7ee35d">OK</text><rect class="card" x="646" y="544" width="308" height="40" rx="12"/><text class="txt" x="666" y="570">Android signer lineage</text><text class="badge" x="930" y="570" text-anchor="end" fill="#7ee35d">OK</text><rect class="card" x="646" y="592" width="308" height="40" rx="12"/><text class="txt" x="666" y="618">ReleaseStatus / policy</text><text class="badge" x="930" y="618" text-anchor="end" fill="#7ee35d">CURRENT</text><rect class="card" x="646" y="640" width="308" height="40" rx="12"/><text class="txt" x="666" y="666">Bootstrap checkpoint floor</text><text class="badge" x="930" y="666" text-anchor="end" fill="#7ee35d">SATISFIED</text><rect class="card" x="646" y="688" width="308" height="40" rx="12"/><text class="txt" x="666" y="714">Package / version rollback</text><text class="badge" x="930" y="714" text-anchor="end" fill="#7ee35d">OK</text></g><text class="tiny" x="800" y="758" text-anchor="middle">Any mismatch or state below verifier floor → installation blocked</text>

  <rect class="phone" x="1085" y="185" width="390" height="610" rx="46"/><rect class="screen" x="1104" y="210" width="352" height="560" rx="30"/><text class="h1" x="1130" y="252">←  Release details</text><rect class="sel" x="1126" y="292" width="308" height="58" rx="16"/><text class="h2" x="1146" y="327">Verified Freedom release</text><text class="badge" x="1408" y="327" text-anchor="end" fill="#7ee35d">CURRENT</text>
  <text class="tiny" x="1130" y="382">RELEASE</text><rect class="card" x="1126" y="400" width="308" height="178" rx="18"/><text class="tiny" x="1146" y="428">Release ID</text><text class="mono" x="1408" y="428" text-anchor="end">r42</text><text class="tiny" x="1146" y="457">Package</text><text class="txt" x="1408" y="457" text-anchor="end">dev.freedom.app</text><text class="tiny" x="1146" y="486">Artifact hash</text><text class="mono" x="1408" y="486" text-anchor="end">9a34…7bc1</text><text class="tiny" x="1146" y="515">Policy epoch</text><text class="badge" x="1408" y="515" text-anchor="end" fill="#7ee35d">CURRENT</text><text class="tiny" x="1146" y="544">Checkpoint floor</text><text class="badge" x="1408" y="544" text-anchor="end" fill="#7ee35d">SATISFIED</text>
  <text class="tiny" x="1130" y="610">BYTE SOURCE</text><rect class="card" x="1126" y="628" width="308" height="82" rx="18"/><text class="h2" x="1146" y="657">Peer transfer</text><text class="tiny" x="1146" y="680">peer://a1b2…7c9d · TTL 08:14</text><text class="tiny" x="1146" y="702">Source is transport only — not trust/freshness</text><rect class="sel" x="1126" y="724" width="308" height="42" rx="16"/><text class="h2" x="1280" y="751" text-anchor="middle">Install verified release</text>

  <text class="tiny" x="800" y="884" text-anchor="middle">Peer · relay · mirror · store are interchangeable byte sources. Trust comes from pinned roots, threshold state, exact hashes, Android signer lineage and a satisfied freshness floor.</text>
</svg>