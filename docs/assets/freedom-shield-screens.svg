<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Freedom Shield product screens</title>
  <desc id="desc">Concept product screens for Freedom Shield and Network Indicator showing observable network state, suspected filtering, automatic path changes and resilience controls.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b11"/><stop offset="1" stop-color="#0a1720"/></linearGradient><style>.bg{fill:url(#bg)}.panel{fill:#0b1620;stroke:#223342;stroke-width:2}.phone{fill:#02070b;stroke:#64748b;stroke-width:4}.screen{fill:#08131c}.top{fill:#0d1a25}.card{fill:#101f2b;stroke:#1e3444;stroke-width:1.5}.sel{fill:#10291d;stroke:#7ee35d;stroke-width:2}.warn{fill:#2b2110;stroke:#f59e0b;stroke-width:1.5}.line{stroke:#294253;stroke-width:1.5}.green{fill:#7ee35d}.cyan{fill:#4cc9f0}.purple{fill:#a78bfa}.orange{fill:#f59e0b}.red{fill:#fb7185}.title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.h1{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.h2{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.txt{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7e2ea}.tiny{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.badge{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style></defs>
  <rect class="bg" width="1600" height="920"/><text class="title" x="70" y="72">Freedom Shield</text><text class="subtitle" x="70" y="106">Network Indicator · Adaptive Defense · Shielded paths · transparent diagnosis instead of hidden failure</text><rect class="panel" x="70" y="140" width="1460" height="700" rx="30"/>

  <rect class="phone" x="125" y="185" width="390" height="610" rx="46"/><rect class="screen" x="144" y="210" width="352" height="560" rx="30"/><text class="h1" x="168" y="252">Network Status</text>
  <circle class="orange" cx="320" cy="360" r="74" opacity=".16"/><circle cx="320" cy="360" r="52" fill="none" stroke="#f59e0b" stroke-width="5"/><text class="h1" x="320" y="354" text-anchor="middle">SUSPECTED</text><text class="tiny" x="320" y="378" text-anchor="middle">selective filtering or route failure</text>
  <rect class="card" x="166" y="454" width="308" height="62" rx="16"/><circle class="green" cx="186" cy="485" r="7"/><text class="txt" x="204" y="481">Peer recently active</text><text class="tiny" x="450" y="486" text-anchor="end">2 min</text>
  <rect class="card" x="166" y="530" width="308" height="62" rx="16"/><circle class="cyan" cx="186" cy="561" r="7"/><text class="txt" x="204" y="557">Control-plane reachable</text><text class="badge" x="450" y="562" text-anchor="end" fill="#7ee35d">YES</text>
  <rect class="warn" x="166" y="606" width="308" height="72" rx="16"/><circle class="orange" cx="186" cy="642" r="7"/><text class="txt" x="204" y="635">Current data path failed</text><text class="tiny" x="204" y="657">Transport A timed out repeatedly</text>
  <rect class="sel" x="166" y="694" width="308" height="44" rx="18"/><text class="h2" x="320" y="722" text-anchor="middle">Shield activated automatically</text><text class="tiny" x="320" y="758" text-anchor="middle">Observation ≠ proof of who is blocking</text>

  <rect class="phone" x="605" y="185" width="390" height="610" rx="46"/><rect class="screen" x="624" y="210" width="352" height="560" rx="30"/><text class="h1" x="650" y="252">←  Recent events</text><text class="tiny" x="650" y="286">FACTS + INFERENCE + RESPONSE</text>
  <rect class="warn" x="646" y="320" width="308" height="94" rx="18"/><text class="badge" x="666" y="348" fill="#f59e0b">11:42 · SUSPECTED</text><text class="txt" x="666" y="374">Possible filtering detected</text><text class="tiny" x="666" y="396">Direct path unavailable while peer state stayed fresh</text>
  <rect class="card" x="646" y="430" width="308" height="94" rx="18"/><text class="badge" x="666" y="458" fill="#4cc9f0">11:38 · RESPONSE</text><text class="txt" x="666" y="484">Alternative path selected</text><text class="tiny" x="666" y="506">Relay DE → NL · Shield mode</text>
  <rect class="sel" x="646" y="540" width="308" height="94" rx="18"/><text class="badge" x="666" y="568" fill="#7ee35d">11:33 · RECOVERED</text><text class="txt" x="666" y="594">Communication restored</text><text class="tiny" x="666" y="616">Stable path · 42 ms · packet loss 0.2%</text>
  <rect class="card" x="646" y="654" width="308" height="72" rx="18"/><text class="h2" x="666" y="682">Active path</text><text class="txt" x="930" y="682" text-anchor="end">IT → DE → NL → Peer</text><text class="tiny" x="666" y="706">Adjacent knowledge separated across hops</text><text class="tiny" x="800" y="758" text-anchor="middle">Same diagnostic facts for Free and Pro</text>

  <rect class="phone" x="1085" y="185" width="390" height="610" rx="46"/><rect class="screen" x="1104" y="210" width="352" height="560" rx="30"/><text class="h1" x="1130" y="252">←  Shield</text><circle class="green" cx="1280" cy="344" r="74" opacity=".15"/><path d="M1280 286 L1332 304 L1324 358 Q1314 405 1280 426 Q1246 405 1236 358 L1228 304 Z" fill="#10291d" stroke="#7ee35d" stroke-width="4"/><text class="h1" x="1280" y="355" text-anchor="middle">✓</text>
  <text class="h2" x="1280" y="452" text-anchor="middle">Protection active</text><text class="tiny" x="1280" y="474" text-anchor="middle">Path resilience policy, not stronger message crypto</text>
  <rect class="sel" x="1126" y="508" width="308" height="62" rx="16"/><text class="h2" x="1146" y="536">Always Shielded</text><text class="tiny" x="1146" y="557">Prefer protected paths continuously</text><circle class="green" cx="1405" cy="539" r="11"/>
  <rect class="card" x="1126" y="584" width="308" height="62" rx="16"/><text class="h2" x="1146" y="612">Bridge rotation</text><text class="tiny" x="1146" y="633">Rotate after blocking evidence</text><circle class="purple" cx="1405" cy="615" r="11"/>
  <rect class="card" x="1126" y="660" width="308" height="62" rx="16"/><text class="h2" x="1146" y="688">Maximum Resilience</text><text class="tiny" x="1146" y="709">Multi-hop · provider diversity · fast failover</text><circle class="cyan" cx="1405" cy="691" r="11"/>
  <text class="tiny" x="1280" y="758" text-anchor="middle">No claim of passive-surveillance detection</text>

  <text class="tiny" x="800" y="884" text-anchor="middle">NORMAL · SHIELDED · DEGRADED · SUSPECTED · UNAVAILABLE describe network state; they never mean “you are being monitored”.</text>
</svg>