<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Freedom system architecture</title>
  <desc id="desc">Architecture showing two Freedom devices, blockchain identity and fallback rendezvous, direct or relayed routes, authenticated encrypted session, and application traffic kept off-chain.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .title { font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .subtitle { font:400 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .section { font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .label { font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .small { font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155; }
      .tiny { font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .box { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:22; }
      .device { fill:#eff6ff; stroke:#60a5fa; stroke-width:3; rx:26; }
      .chain { fill:#f5f3ff; stroke:#8b5cf6; stroke-width:3; rx:26; }
      .route { fill:#f0fdf4; stroke:#22c55e; stroke-width:3; rx:26; }
      .relay { fill:#fff7ed; stroke:#fb923c; stroke-width:3; rx:26; }
      .session { fill:#ecfeff; stroke:#06b6d4; stroke-width:3; rx:26; }
      .app { fill:#f8fafc; stroke:#94a3b8; stroke-width:2; rx:20; }
      .line { stroke:#475569; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#64748b; stroke-width:3; stroke-dasharray:10 9; fill:none; marker-end:url(#arrow); }
      .secure { stroke:#0891b2; stroke-width:7; fill:none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text class="title" x="800" y="62" text-anchor="middle">Freedom — struttura del sistema</text>
  <text class="subtitle" x="800" y="100" text-anchor="middle">Identità on-chain, comunicazione off-chain, rendezvous solo quando serve</text>

  <!-- Devices -->
  <rect class="device" x="80" y="220" width="300" height="250"/>
  <text class="section" x="230" y="270" text-anchor="middle">Device A</text>
  <text class="small" x="120" y="315">DeviceID</text>
  <text class="small" x="120" y="350">Identity private key</text>
  <text class="small" x="120" y="385">Route candidates</text>
  <text class="small" x="120" y="420">Messaggi / media locali</text>

  <rect class="device" x="1220" y="220" width="300" height="250"/>
  <text class="section" x="1370" y="270" text-anchor="middle">Device B</text>
  <text class="small" x="1260" y="315">DeviceID</text>
  <text class="small" x="1260" y="350">Identity private key</text>
  <text class="small" x="1260" y="385">Route candidates</text>
  <text class="small" x="1260" y="420">Messaggi / media locali</text>

  <!-- Blockchain -->
  <rect class="chain" x="520" y="150" width="560" height="250"/>
  <text class="section" x="800" y="200" text-anchor="middle">Blockchain layer — NEAR Testnet</text>

  <rect class="box" x="565" y="230" width="220" height="125"/>
  <text class="label" x="675" y="270" text-anchor="middle">Device Registry</text>
  <text class="tiny" x="675" y="305" text-anchor="middle">DeviceID → public key</text>
  <text class="tiny" x="675" y="330" text-anchor="middle">key epoch / revocation</text>

  <rect class="box" x="815" y="230" width="220" height="125"/>
  <text class="label" x="925" y="270" text-anchor="middle">Rendezvous</text>
  <text class="tiny" x="925" y="305" text-anchor="middle">fallback read-before-write</text>
  <text class="tiny" x="925" y="330" text-anchor="middle">record opaco + TTL</text>

  <!-- Read/resolve arrows -->
  <path class="dash" d="M380 285 C445 250, 470 250, 520 270"/>
  <path class="dash" d="M1220 285 C1155 250, 1130 250, 1080 270"/>
  <text class="tiny" x="450" y="235" text-anchor="middle">resolve / fallback</text>
  <text class="tiny" x="1150" y="235" text-anchor="middle">resolve / fallback</text>

  <!-- Routing layer -->
  <rect class="route" x="500" y="485" width="600" height="150"/>
  <text class="section" x="800" y="530" text-anchor="middle">Route establishment</text>
  <text class="small" x="800" y="570" text-anchor="middle">1. route noto → 2. NAT traversal → 3. relay → 4. blockchain rendezvous</text>
  <text class="tiny" x="800" y="605" text-anchor="middle">Finché esiste un percorso valido, gli update viaggiano direttamente nella sessione</text>

  <path class="line" d="M380 390 C440 430, 465 490, 500 540"/>
  <path class="line" d="M1220 390 C1160 430, 1135 490, 1100 540"/>

  <!-- Relay -->
  <rect class="relay" x="645" y="675" width="310" height="105"/>
  <text class="label" x="800" y="715" text-anchor="middle">Relay Freedom opzionale</text>
  <text class="tiny" x="800" y="747" text-anchor="middle">forward-only · ciphertext · buffer temporanei</text>

  <!-- Secure session -->
  <rect class="session" x="425" y="820" width="750" height="110"/>
  <text class="section" x="800" y="860" text-anchor="middle">Authenticated E2EE session</text>
  <text class="small" x="800" y="897" text-anchor="middle">messaggi · ACK · file · signaling chiamate · route update</text>

  <!-- Secure paths -->
  <path class="secure" d="M380 445 C500 710, 1100 710, 1220 445"/>
  <text class="small" x="800" y="685" text-anchor="middle">percorso diretto quando disponibile</text>

  <path class="line" d="M650 635 C690 655, 710 665, 725 675"/>
  <path class="line" d="M950 675 C975 660, 1000 650, 1035 635"/>

  <path class="line" d="M800 780 L800 820"/>

  <!-- Footer principles -->
  <text class="tiny" x="80" y="960">La blockchain non trasporta messaggi o media. I relay non conservano conversazioni. Se il peer non è raggiungibile, i dati applicativi restano sull'endpoint mittente.</text>
</svg>