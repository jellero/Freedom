<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Freedom UI concept screens</title>
  <desc id="desc">Conceptual populated Freedom Messenger screens for chat, Freedom Gateway and Share Freedom release verification. These are product mockups, not screenshots of the current Android transport spike.</desc>
  <defs>
    <style>
      .bg{fill:#071019}.panel{fill:#0b1620;stroke:#223342;stroke-width:2}.phone{fill:#050b11;stroke:#475569;stroke-width:4}.screen{fill:#09131c}.top{fill:#0d1a25}.card{fill:#101f2b;stroke:#1e3444;stroke-width:1.5}.green{fill:#7ee35d}.cyan{fill:#4cc9f0}.blue{fill:#60a5fa}.orange{fill:#f59e0b}.purple{fill:#a78bfa}.red{fill:#fb7185}.muted{fill:#8aa0b3}.white{fill:#f8fafc}.title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.h1{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.h2{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.txt{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7e2ea}.tiny{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.badge{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#b8c7d4}.line{stroke:#294253;stroke-width:1.5}.route{stroke:#4cc9f0;stroke-width:3;fill:none}.route2{stroke:#a78bfa;stroke-width:3;fill:none;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect class="bg" width="1500" height="980"/>
  <text class="title" x="70" y="70">Freedom — populated UI concept</text>
  <text class="subtitle" x="70" y="102">Communication · Gateway · verified decentralized app distribution</text>
  <rect class="panel" x="70" y="135" width="1360" height="760" rx="28"/>

  <!-- Phone 1 Chat -->
  <rect class="phone" x="125" y="185" width="360" height="650" rx="44"/>
  <rect class="screen" x="143" y="210" width="324" height="600" rx="28"/>
  <rect class="top" x="143" y="210" width="324" height="82" rx="28"/>
  <circle class="green" cx="178" cy="253" r="18"/><text class="h2" x="208" y="248">Alice</text><text class="tiny" x="208" y="270">● Live · E2EE</text>
  <circle class="green" cx="440" cy="252" r="6"/><text class="tiny" x="423" y="276" text-anchor="end">NORMAL</text>
  <text class="tiny" x="164" y="322">TODAY · LIVE SESSION</text>
  <rect class="card" x="164" y="345" width="215" height="72" rx="18"/><text class="txt" x="182" y="374">Hai visto il cambio route?</text><text class="tiny" x="182" y="399">11:42 · delivered live</text>
  <rect x="226" y="435" width="220" height="78" rx="18" fill="#153624" stroke="#276749"/><text class="txt" x="244" y="466">Sì, Shield è entrato da solo.</text><text class="tiny" x="244" y="491">11:42 · ACK</text>
  <rect class="card" x="164" y="535" width="282" height="90" rx="18"/><circle class="cyan" cx="190" cy="564" r="7"/><text class="h2" x="210" y="570">Freedom Network</text><text class="tiny" x="182" y="596">Route: Shielded relay · RTT 61 ms</text><text class="tiny" x="182" y="616">Peer verified · no anomaly</text>
  <rect class="card" x="164" y="704" width="235" height="52" rx="22"/><text class="tiny" x="184" y="735">Message — active session only</text><circle class="green" cx="430" cy="730" r="22"/><path d="M422 730 L438 722 L434 738 Z" fill="#071019"/>
  <text class="tiny" x="305" y="786" text-anchor="middle">Chat · Call · Video · Live · Network</text>

  <!-- Phone 2 Gateway -->
  <rect class="phone" x="570" y="185" width="360" height="650" rx="44"/>
  <rect class="screen" x="588" y="210" width="324" height="600" rx="28"/>
  <rect class="top" x="588" y="210" width="324" height="82" rx="28"/>
  <text class="h1" x="612" y="252">Freedom Gateway</text><circle class="green" cx="875" cy="252" r="7"/><text class="tiny" x="875" y="276" text-anchor="middle">ON</text>
  <rect class="card" x="610" y="315" width="280" height="120" rx="20"/>
  <text class="tiny" x="630" y="344">STATUS</text><text class="h2" x="630" y="370">Protected path active</text><text class="tiny" x="630" y="397">Selected apps · 3 protected</text><text class="tiny" x="630" y="418">82 MB / 100 MB today</text>
  <rect x="630" y="425" width="230" height="6" rx="3" fill="#1e3341"/><rect x="630" y="425" width="188" height="6" rx="3" class="green"/>
  <text class="tiny" x="610" y="473">CURRENT PATH</text>
  <rect class="card" x="610" y="490" width="280" height="178" rx="20"/>
  <circle class="cyan" cx="640" cy="525" r="9"/><text class="txt" x="663" y="530">Transport B · web-like</text>
  <path class="route" d="M640 548 C680 570 710 552 748 575 S820 600 860 575"/>
  <circle class="blue" cx="640" cy="548" r="6"/><circle class="purple" cx="748" cy="575" r="6"/><circle class="green" cx="860" cy="575" r="6"/>
  <text class="tiny" x="630" y="617">Device</text><text class="tiny" x="725" y="617">Bridge</text><text class="tiny" x="832" y="617">Egress CH</text>
  <text class="tiny" x="630" y="647">Filtering: none · DNS protected</text>
  <rect class="card" x="610" y="690" width="280" height="78" rx="20"/><text class="h2" x="630" y="720">Maximum Reachability</text><text class="tiny" x="630" y="744">Automatic failover · standby paths ready</text><circle class="green" cx="858" cy="730" r="14"/>
  <text class="tiny" x="750" y="791" text-anchor="middle">Gateway ≠ Freedom E2EE conversation</text>

  <!-- Phone 3 Share/Verify -->
  <rect class="phone" x="1015" y="185" width="360" height="650" rx="44"/>
  <rect class="screen" x="1033" y="210" width="324" height="600" rx="28"/>
  <rect class="top" x="1033" y="210" width="324" height="82" rx="28"/>
  <text class="h1" x="1057" y="252">Share Freedom</text><text class="tiny" x="1057" y="276">Verified release network</text>
  <rect class="card" x="1055" y="315" width="280" height="138" rx="20"/>
  <text class="h2" x="1075" y="345">Freedom 1.4.2</text><text class="tiny" x="1075" y="371">Release</text><text class="badge" x="1308" y="371" text-anchor="end" fill="#7ee35d">VERIFIED</text>
  <text class="tiny" x="1075" y="395">Security state</text><text class="badge" x="1308" y="395" text-anchor="end" fill="#7ee35d">ACTIVE</text>
  <text class="tiny" x="1075" y="419">Artifact</text><text class="mono" x="1308" y="419" text-anchor="end">9a34…7bc1</text>
  <text class="tiny" x="1075" y="443">Sources</text><text class="txt" x="1308" y="443" text-anchor="end">7 available</text>

  <!-- QR stylized -->
  <rect x="1103" y="480" width="184" height="184" rx="10" fill="#f8fafc"/>
  <g fill="#071019">
    <rect x="1120" y="497" width="48" height="48"/><rect x="1128" y="505" width="32" height="32" fill="#f8fafc"/><rect x="1136" y="513" width="16" height="16"/>
    <rect x="1222" y="497" width="48" height="48"/><rect x="1230" y="505" width="32" height="32" fill="#f8fafc"/><rect x="1238" y="513" width="16" height="16"/>
    <rect x="1120" y="599" width="48" height="48"/><rect x="1128" y="607" width="32" height="32" fill="#f8fafc"/><rect x="1136" y="615" width="16" height="16"/>
    <rect x="1180" y="505" width="12" height="12"/><rect x="1198" y="523" width="12" height="12"/><rect x="1178" y="545" width="18" height="12"/><rect x="1204" y="550" width="12" height="22"/><rect x="1230" y="558" width="18" height="12"/><rect x="1255" y="572" width="12" height="18"/><rect x="1180" y="582" width="14" height="14"/><rect x="1202" y="600" width="20" height="12"/><rect x="1228" y="615" width="12" height="28"/><rect x="1250" y="610" width="18" height="12"/>
  </g>
  <text class="tiny" x="1195" y="687" text-anchor="middle">One-shot / TTL download capability</text>
  <rect class="card" x="1055" y="710" width="280" height="66" rx="20"/><text class="tiny" x="1075" y="738">Filename locator</text><text class="mono" x="1075" y="760">freedom-r42-454fjk…apk</text><text class="badge" x="1312" y="749" text-anchor="end" fill="#f59e0b">NOT TRUST</text>

  <text class="tiny" x="750" y="930" text-anchor="middle">Concept visual — not a screenshot of the current transport/crypto spike. Product UI must remain consistent with the implemented security state.</text>
