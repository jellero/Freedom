<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Freedom Gateway product screens</title>
  <desc id="desc">Concept product screens for Freedom Gateway showing selected-app routing, adaptive paths, managed egress quota, DNS protection and Maximum Reachability.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b11"/><stop offset="1" stop-color="#0a1720"/></linearGradient><style>.bg{fill:url(#bg)}.panel{fill:#0b1620;stroke:#223342;stroke-width:2}.phone{fill:#02070b;stroke:#64748b;stroke-width:4}.screen{fill:#08131c}.top{fill:#0d1a25}.card{fill:#101f2b;stroke:#1e3444;stroke-width:1.5}.sel{fill:#10291d;stroke:#7ee35d;stroke-width:2}.line{stroke:#294253;stroke-width:1.5}.route{stroke:#7ee35d;stroke-width:4;fill:none}.green{fill:#7ee35d}.cyan{fill:#4cc9f0}.purple{fill:#a78bfa}.orange{fill:#f59e0b}.muted{fill:#8aa0b3}.title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.h1{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.h2{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.txt{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7e2ea}.tiny{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8aa0b3}.badge{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style></defs>
  <rect class="bg" width="1600" height="920"/><text class="title" x="70" y="72">Freedom Gateway</text><text class="subtitle" x="70" y="106">Adaptive network path for selected apps or the whole device · explicit egress · no community phone becomes an Internet exit</text><rect class="panel" x="70" y="140" width="1460" height="700" rx="30"/>

  <rect class="phone" x="125" y="185" width="390" height="610" rx="46"/><rect class="screen" x="144" y="210" width="352" height="560" rx="30"/><rect class="top" x="144" y="210" width="352" height="86" rx="30"/>
  <text class="h1" x="168" y="250">Gateway</text><circle class="green" cx="170" cy="276" r="6"/><text class="badge" x="186" y="280" fill="#7ee35d">CONNECTED</text>
  <rect class="card" x="166" y="320" width="308" height="145" rx="20"/><text class="tiny" x="186" y="348">ACTIVE PATH</text><text class="h2" x="186" y="376">IT → Bridge DE → Egress CH</text><path class="route" d="M190 416 C240 380 292 438 342 402 S418 420 450 390"/><circle class="green" cx="190" cy="416" r="7"/><circle class="cyan" cx="320" cy="411" r="7"/><circle class="purple" cx="450" cy="390" r="7"/><text class="tiny" x="186" y="446">Transport B · web-like carrier · 58 ms</text>
  <rect class="card" x="166" y="490" width="308" height="130" rx="20"/><text class="h2" x="186" y="520">Managed capacity</text><text class="txt" x="450" y="520" text-anchor="end">82 MB / 100 MB</text><rect x="186" y="548" width="264" height="9" rx="5" fill="#1e3341"/><rect x="186" y="548" width="216" height="9" rx="5" class="green"/><text class="tiny" x="186" y="584">Free target · resets daily</text><text class="tiny" x="186" y="605">Communication traffic is accounted separately</text>
  <rect class="card" x="166" y="646" width="308" height="78" rx="20"/><text class="h2" x="186" y="675">Protected apps</text><text class="txt" x="450" y="675" text-anchor="end">Chrome · Firefox · Mail</text><text class="tiny" x="186" y="702">Selected-app mode</text><text class="tiny" x="320" y="752" text-anchor="middle">Overview · Paths · Quota · Settings</text>

  <rect class="phone" x="605" y="185" width="390" height="610" rx="46"/><rect class="screen" x="624" y="210" width="352" height="560" rx="30"/><text class="h1" x="650" y="252">←  Paths</text><text class="tiny" x="650" y="284">Choose policy; engine chooses viable transport/endpoints</text>
  <rect class="sel" x="646" y="318" width="308" height="88" rx="18"/><text class="h2" x="666" y="347">Fast</text><text class="tiny" x="666" y="372">IT → DE → CH · 32 ms</text><circle class="green" cx="926" cy="360" r="10"/>
  <rect class="card" x="646" y="426" width="308" height="88" rx="18"/><text class="h2" x="666" y="455">Balanced</text><text class="tiny" x="666" y="480">IT → NL → CH · 58 ms</text><circle class="cyan" cx="926" cy="468" r="10"/>
  <rect class="card" x="646" y="534" width="308" height="88" rx="18"/><text class="h2" x="666" y="563">Maximum Reachability</text><text class="tiny" x="666" y="588">Bridge pool · aggressive failover · 94 ms</text><circle class="purple" cx="926" cy="576" r="10"/>
  <rect class="card" x="646" y="642" width="308" height="88" rx="18"/><text class="h2" x="666" y="671">Private</text><text class="tiny" x="666" y="696">Private bridge → private egress</text><circle class="orange" cx="926" cy="684" r="10"/>
  <text class="tiny" x="800" y="752" text-anchor="middle">No single server, route, transport or provider is permanent</text>

  <rect class="phone" x="1085" y="185" width="390" height="610" rx="46"/><rect class="screen" x="1104" y="210" width="352" height="560" rx="30"/><text class="h1" x="1130" y="252">←  Gateway settings</text><text class="tiny" x="1130" y="290">MODE</text>
  <rect class="sel" x="1126" y="310" width="308" height="78" rx="18"/><text class="h2" x="1146" y="340">Selected apps</text><text class="tiny" x="1146" y="365">3 apps protected</text><circle class="green" cx="1405" cy="349" r="12"/>
  <rect class="card" x="1126" y="408" width="308" height="78" rx="18"/><text class="h2" x="1146" y="438">Whole device</text><text class="tiny" x="1146" y="463">Route all eligible traffic</text><circle cx="1405" cy="447" r="12" fill="none" stroke="#64748b" stroke-width="2"/>
  <text class="tiny" x="1130" y="520">SECURITY</text><rect class="card" x="1126" y="540" width="308" height="78" rx="18"/><text class="h2" x="1146" y="570">DNS leak protection</text><text class="tiny" x="1146" y="595">Keep DNS on protected path</text><rect x="1380" y="563" width="40" height="22" rx="11" class="green"/><circle cx="1409" cy="574" r="8" fill="#071019"/>
  <rect class="card" x="1126" y="638" width="308" height="78" rx="18"/><text class="h2" x="1146" y="668">Egress preference</text><text class="tiny" x="1146" y="693">Automatic · Switzerland preferred</text><text class="txt" x="1408" y="680" text-anchor="end">›</text>
  <text class="tiny" x="1280" y="752" text-anchor="middle">Gateway protects the path; final app security still depends on the app protocol</text>
  <text class="tiny" x="800" y="884" text-anchor="middle">Product concept — the Gateway uses explicit MANAGED / PRIVATE / BUSINESS egress roles; DEVICE_RELAY is never an implicit Internet exit.</text>
</svg>